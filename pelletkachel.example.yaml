# Kopieer als pelletkachel.yaml naast je echte secrets.yaml.
# SPDX-License-Identifier: MIT
substitutions:
  device_name: pelletkachel
  friendly_name: Pelletkachel
  # 0 = ID ontdekken, ALLE zendingen geblokkeerd. Vul daarna je eigen 24-bit hex-ID in.
  mcz_remote_id: "0x000000"
  mcz_living_sensor: "sensor.woonkamer_temperatuur"

packages:
  mcz_bediening: !include packages/mcz-bediening.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  min_version: 2026.10.0
  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(display_seed) = esphome::random_uint32();
      - component.update: oled_display

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Pelletkachel Fallback"
    password: !secret fallback_password

captive_portal:

spi:
  clk_pin: GPIO5
  mosi_pin: GPIO27
  miso_pin: GPIO19

sx127x:
  cs_pin: GPIO18
  rst_pin: GPIO23
  frequency: 434.5MHz
  bandwidth: 50_0kHz
  modulation: OOK
  bitsync: false
  packet_mode: false
  rx_start: true
  rx_floor: -80

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP-adres"
      id: ip_address

globals:
  - id: display_seed
    type: uint32_t
    initial_value: '0'

interval:
  - interval: 5min
    then:
      - lambda: |-
          id(display_seed) = esphome::random_uint32();
      - component.update: oled_display

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 12

i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 400kHz

display:
  - platform: ssd1306_i2c
    id: oled_display
    model: "SSD1306 128x64"
    address: 0x3C
    contrast: 30%
    update_interval: 1s
    lambda: |-
      it.fill(COLOR_OFF);
      const std::string label = "${friendly_name}";
      const std::string ip = id(ip_address).has_state()
          ? "IP: " + id(ip_address).state : "WiFi verbinden...";
      int x1, y1, w1, h1, w2, h2;
      it.get_text_bounds(0, 0, label.c_str(), id(font_small), TextAlign::TOP_LEFT, &x1, &y1, &w1, &h1);
      it.get_text_bounds(0, 0, ip.c_str(), id(font_small), TextAlign::TOP_LEFT, &x1, &y1, &w2, &h2);
      const int width = std::max(w1, w2);
      const int x = id(display_seed) % std::max(1, 128 - width + 1);
      const int y = (id(display_seed) >> 8) % std::max(1, 64 - (18 + h2) + 1);
      it.print(x, y, id(font_small), TextAlign::TOP_LEFT, label.c_str());
      it.print(x, y + 18, id(font_small), TextAlign::TOP_LEFT, ip.c_str());
